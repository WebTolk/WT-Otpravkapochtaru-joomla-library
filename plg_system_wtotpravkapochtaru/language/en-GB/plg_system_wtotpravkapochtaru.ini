PLG_SYSTEM_WT_OTPRAVKAPOCHTARU_SHIPPING_POINTS_EXAMPLE_DESC="<p>Self-contained example for your Joomla extension. The facade uses credentials saved in this system plugin.</p><pre><code class='language-php'>&lt;?php&#10;use Webtolk\Otpravkapochtaru\Otpravkapochtaru;&#10;&#10;$client = new Otpravkapochtaru();&#10;$shippingPoints = $client-&gt;otpravkaApi()-&gt;shippingPoints();&#10;&#10;foreach ($shippingPoints as $point) {&#10;    $postcode = (string) ($point['operator-postcode'] ?? '');&#10;    $address = (string) ($point['ops-address'] ?? $point['address'] ?? $point['operator-address'] ?? '');&#10;&#10;    echo trim($postcode . ' - ' . $address) . PHP_EOL;&#10;}</code></pre>"
