category: tooling
summary: codex-exec carries MCP requirements as metadata but does not prove callable MCP tools inside the worker runtime.
rationale: In this run, PHPStorm MCP was configured and reachable, and assignment capsules listed phpstorm as activated, but workers performed code/file operations through shell commands. This caused an MCP-first policy violation even though the assignment metadata looked correct.
statement:
  details: Worker launch prompts and capsules need a runtime gate that distinguishes declared MCP access from actual callable MCP tool availability.
suggested_change:
  proposed_text: Add a codex-exec runtime preflight that enumerates callable tools inside the worker session, fails fast when required MCP tools are missing, and records the result in worker telemetry before code edits. The driver contract should state whether workspace_access.mcp is only metadata or an injected tool surface.
payload:
  observed_behavior:
    - PHPStorm endpoint at 127.0.0.1:64442 returned HTTP 200.
    - workspace-access.json listed phpstorm and serena under mcp.
    - worker stderr showed shell commands such as Get-Content, rg, Set-Content, and New-Item for code/file work.
    - no accepted PHPStorm MCP project operation was recorded.
    - after PowerShell fallback was approved, the built-in codex-exec driver still launched workers with PF_CODEX_SANDBOX=read-only, preventing product-code writes.
  recommended_gate:
    - Worker must prove callable MCP use with one read-only IDE operation before editing code.
    - If the callable MCP tool is missing, worker must stop unless orchestrator explicitly records a fallback waiver.
    - If fallback is approved for implementation, the selected runtime driver must use a write-capable sandbox and log that selection.
