stage: assurance
work_mode: assurance
artifacts_in:
  - changed-files
  - change-summary
  - implementation-plan
artifacts_out:
  - review-findings
  - test-plan
  - test-cases
  - browser-verification-report
required_tools:
  - phpstorm-mcp
  - serena
  - devtools
optional_tools:
  - shell
allowed_next_skills:
  - release-delivery
  - implementation
  - investigation
failure_conditions:
  - no verification evidence
  - critical findings unresolved
  - residual risk unclassified
quality_gates:
  - verification evidence is attached
  - blocking findings are classified
  - release recommendation is explicit
logging_requirements:
  - update verification-log with executed checks
  - update agent-log with findings summary
  - record fallback usage in tool telemetry
tool_policy_overrides:
  require_devtools_for_browser_affecting_changes: true
  allow_shell_only_for_toolchain-invoked_checks: true
handoff_contract:
  ready_when:
    - findings are enumerated
    - verification evidence is attached
    - release recommendation is explicit
  must_include:
    - severity-ordered findings
    - executed checks
    - skipped checks with reasons
    - residual risks
  blocks_handoff_when:
    - blocking defects remain open
