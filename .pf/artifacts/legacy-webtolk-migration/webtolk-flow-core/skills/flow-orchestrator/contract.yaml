stage: orchestration
work_mode: orchestration
artifacts_in:
  - task-record
  - artifact-index
  - project-context
artifacts_out:
  - stage-decision
  - next-skill-handoff
required_tools:
  - phpstorm-mcp
  - serena
optional_tools:
  - devtools
  - shell
allowed_next_skills:
  - intake-scope
  - investigation
  - domain-surface
  - architecture-plan
  - implementation
  - code-assurance
  - release-delivery
  - evolve
failure_conditions:
  - current stage cannot be inferred
  - required artifacts invalid or missing
  - requested tool violates policy
quality_gates:
  - current stage is explicitly recorded
  - next skill matches allowed_next_skills
  - tool policy decision is recorded
logging_requirements:
  - update task-log on stage change
  - update agent-log with routing rationale
  - record fallback decisions in tool telemetry
tool_policy_overrides:
  allow_shell_only_after_policy_failure: true
  require_mcp_policy_check_before_tool_use: true
handoff_contract:
  ready_when:
    - current stage decision is recorded
    - next skill is selected
    - tool policy decision is logged
  must_include:
    - stage name
    - unmet prerequisites
    - next skill
    - tool policy result
  blocks_handoff_when:
    - no valid next skill exists
    - stage gate failed without remediation
