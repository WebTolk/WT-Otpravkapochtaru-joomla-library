stage: investigation
work_mode: investigation
artifacts_in:
  - brief
  - scope
  - project-context
artifacts_out:
  - investigation-report
  - impact-analysis
required_tools:
  - phpstorm-mcp
  - serena
  - devtools
optional_tools:
  - shell
allowed_next_skills:
  - domain-surface
  - architecture-plan
  - implementation
  - code-assurance
failure_conditions:
  - evidence does not support findings
  - impact surface remains unknown
  - root cause cannot be bounded
quality_gates:
  - evidence supports findings
  - impact surface is documented
logging_requirements:
  - update verification-log with evidence sources
  - record fallback analysis steps in tool telemetry
tool_policy_overrides:
  allow_shell_for_environment_inspection_only: true
handoff_contract:
  ready_when:
    - investigation question is answered or narrowed
    - impact surface is documented
  must_include:
    - evidence
    - hypotheses
    - confirmed findings
    - remaining unknowns
  blocks_handoff_when:
    - conclusions are unsupported
    - critical unknowns are untracked
