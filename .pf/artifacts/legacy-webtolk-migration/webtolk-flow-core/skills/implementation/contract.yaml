stage: implementation
work_mode: implementation
artifacts_in:
  - architecture
  - implementation-plan
  - decision-log
artifacts_out:
  - changed-files
  - change-summary
required_tools:
  - phpstorm-mcp
  - serena
optional_tools:
  - shell
  - devtools
allowed_next_skills:
  - code-assurance
  - investigation
failure_conditions:
  - implementation diverges from plan without recorded decision
  - changed files not tracked
  - fallback tool usage not logged
quality_gates:
  - code changes match planned slice
  - changed-files and change-summary are updated
  - fallback tool usage is traceable
logging_requirements:
  - update task-log after each completed change slice
  - update agent-log with files changed
  - record fallback usage in tool telemetry
tool_policy_overrides:
  allow_shell_only_for_non-mcp-supported_operations: true
  require_telemetry_for_each_fallback: true
handoff_contract:
  ready_when:
    - code changes are complete for planned slice
    - changed-files and change-summary are updated
  must_include:
    - files changed
    - behavior changed
    - unresolved risks
    - fallback telemetry references
  blocks_handoff_when:
    - change inventory incomplete
    - implementation broke planned boundaries
