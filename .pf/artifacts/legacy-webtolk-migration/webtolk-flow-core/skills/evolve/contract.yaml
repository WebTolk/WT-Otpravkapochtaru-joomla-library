stage: evolve
work_mode: learning
artifacts_in:
  - patch
  - evolution-cursor
  - logs
artifacts_out:
  - evolution-report
  - updated-rules-or-extensions
  - updated-cursor
required_tools:
  - phpstorm-mcp
  - serena
optional_tools:
  - shell
allowed_next_skills:
  - flow-orchestrator
failure_conditions:
  - learning is task-local only
  - target reusable layer is not identified
  - cursor cannot be updated consistently
quality_gates:
  - learning is stable and reusable
  - cursor update is traceable
logging_requirements:
  - update task-log with evolution decision
  - record reusable updates in agent-log
  - record fallback usage in tool telemetry
tool_policy_overrides:
  allow_shell_only_for_package-maintenance_operations: true
handoff_contract:
  ready_when:
    - stable learning is classified
    - target reusable layer is updated or explicitly rejected
  must_include:
    - source patch ids
    - knowledge extracted
    - target files updated
    - cursor delta
  blocks_handoff_when:
    - evolution report missing
    - update is not traceable to a patch
