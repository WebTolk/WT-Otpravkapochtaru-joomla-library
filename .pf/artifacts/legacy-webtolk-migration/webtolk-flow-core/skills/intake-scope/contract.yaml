stage: intake
work_mode: intake
artifacts_in:
  - task-request
  - project-context
artifacts_out:
  - brief
  - scope
  - task-record
required_tools:
  - phpstorm-mcp
optional_tools:
  - serena
allowed_next_skills:
  - artifact-policy
  - investigation
  - domain-surface
failure_conditions:
  - task outcome undefined
  - scope conflicts with constraints
  - non-goals omitted for high-risk tasks
quality_gates:
  - brief and scope are complete
  - success criteria are explicit
logging_requirements:
  - update task-log with intake status
  - record assumptions in agent-log
tool_policy_overrides:
  allow_shell_only_for_context_bootstrap: true
handoff_contract:
  ready_when:
    - brief and scope are complete
    - requested mode is explicit
  must_include:
    - success criteria
    - out-of-scope list
    - constraints
    - assumptions
  blocks_handoff_when:
    - scope boundary remains ambiguous
