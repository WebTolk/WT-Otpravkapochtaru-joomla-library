stage: architecture
work_mode: planning
artifacts_in:
  - brief
  - scope
  - decision-log
  - impact-analysis
artifacts_out:
  - architecture
  - implementation-plan
required_tools:
  - phpstorm-mcp
  - serena
optional_tools:
  - shell
allowed_next_skills:
  - implementation
  - code-assurance
failure_conditions:
  - design does not address known risks
  - rollout order undefined
  - assurance requirements missing
quality_gates:
  - architecture addresses known risks
  - rollout order is explicit
logging_requirements:
  - update task-log with planning completion
  - record design decisions in agent-log
tool_policy_overrides:
  prefer_mcp_and_serena_for_design_traceability: true
handoff_contract:
  ready_when:
    - architecture and plan are complete
    - change order is explicit
  must_include:
    - target design
    - alternatives considered
    - file/module change surface
    - assurance checkpoints
  blocks_handoff_when:
    - implementation order is ambiguous
