toolchain:
  name: php
  contract_version: 1.0.0
  path_resolution:
    base: webtolk_root
    relative_only: true
  sources:
    toolchain_definition: toolchains/php/toolchain.json
  logical_tools:
    phpstan:
      resolves_to: tools/php-qa/phpstan.neon
      execution:
        strategy: configured-toolchain
        command_name: phpstan
    phpunit:
      resolves_to: tools/php-qa/phpunit.xml
      execution:
        strategy: configured-toolchain
        command_name: phpunit
    php-cs-fixer:
      resolves_to: tools/php-qa/.php-cs-fixer.dist.php
      execution:
        strategy: configured-toolchain
        command_name: php-cs-fixer
    phing:
      resolves_to: tools/phing-packager/phing-latest.phar
      execution:
        strategy: configured-toolchain
        command_name: phing
  policy:
    use_relative_paths_only: true
    forbid_absolute_paths_in_templates: true
    fallback_to_shell: only_when_toolchain_contract_cannot_be_applied
