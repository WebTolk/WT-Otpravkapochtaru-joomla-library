toolchain:
  name: javascript
  contract_version: 1.0.0
  path_resolution:
    base: webtolk_root
    relative_only: true
  sources:
    toolchain_definition: toolchains/javascript/toolchain.json
  logical_tools:
    eslint:
      resolves_to: tools/frontend-qa/config/eslint.config.mjs
      execution:
        strategy: configured-toolchain
        command_name: eslint
    stylelint:
      resolves_to: tools/frontend-qa/config/.stylelintrc.json
      execution:
        strategy: configured-toolchain
        command_name: stylelint
  policy:
    use_relative_paths_only: true
    forbid_absolute_paths_in_templates: true
    fallback_to_shell: only_when_toolchain_contract_cannot_be_applied
