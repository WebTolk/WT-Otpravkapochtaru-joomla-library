project:
  name: WT Otpravkapochtaru Joomla Library
  summary: Joomla library package for integrating with the Russian Post REST API.
  repository_root: .
  primary_artifact_root: .webtolk

platform:
  id: joomla
  variant: extension
  extension_type: package
  platform_contract: D:/.agents/platforms/joomla/platform.json
  platform_context_loaded: true
  platform_sources:
    required:
      - D:/.agents/docs/joomla-toolkit/README.md
      - D:/.agents/docs/joomla-toolkit/joomla-architecture-rules.md
      - D:/.agents/docs/
      - D:/.agents/docs/joomla-development-articles/podklyuchenie-storonnih-php-bibliotek-v-joomla-web-tolk.md
    conditional:
      extension-structure:
        - D:/.agents/docs/joomla-toolkit/joomla-extension-structures.md
      api-or-webservices:
        - D:/.agents/docs/joomla-toolkit/joomla6-rest-api-core-full.md
  platform_checks_applied:
    - phpstorm-mcp-preferred-for-files
    - serena-required-for-symbol-analysis
    - devtools-required-for-browser-verification

repository:
  repo_root: .

deployment:
  test_joomla_instance: D:/OSPanel/home/joomla.local/public
  admin_url: http://joomla.local/administrator
  package_output: .webtolk/build
  package_type: zip
  admin_credentials:
    username: codex
    password: codexcodexcodex

overlays:
  platform:
    - joomla
  toolchain:
    - php
  domain:
    - joomla-extension
  tooling:
    - phpstorm-mcp
    - serena
    - context7
    - devtools
  project_extensions: []

constraints:
  forbidden_paths:
    - vendor/
    - node_modules/
    - dist/
  release_constraints:
    - Update release-notes and migration-notes before delivery.
    - Validate install, update and uninstall safety before release.
    - Preserve manifest versioning and namespace alignment.
  verification_constraints:
    - Use Joomla platform checks before implementation, assurance and release.
    - Browser verification is required for administrator UI changes.
    - Review deprecated API usage against the Joomla toolkit.

environments:
  local:
    joomla_version: "5.x or 6.x target"
    app_url: http://joomla.local
  ci:
    enabled: false
  release:
    package_format: zip
    deployment_target: Joomla extension installer

artifact_locations:
  briefs: docs/briefs
  reports: docs/reports
  release: docs/release

tooling:
  phpstorm_mcp_required: true
  serena_required: true
  devtools_required: true
  context7_required: true
  shell_fallback_allowed: true
  usage_policy:
    phpstorm_mcp: Use by default for file reads, file edits, tree inspection and workspace search.
    serena: Use when the task needs symbol-aware analysis, reference lookup, semantic navigation or multi-file structure understanding.
    context7: Use as an additional official documentation source for Joomla, PHP and related toolchains after local project docs and together with Joomla local references.
    devtools: Use for browser verification and runtime inspection.
  context7_libraries:
    joomla_manual: /joomla/manual
  logical_tools:
    phpstan:
      toolchain: php
      policy: configured-toolchain
    phpunit:
      toolchain: php
      policy: configured-toolchain
    php-cs-fixer:
      toolchain: php
      policy: configured-toolchain
    phing:
      toolchain: php
      policy: configured-toolchain

joomla_expectations:
  mandatory_checks:
    - core-first-decision-making
    - service-provider-and-di-patterns
    - thin-controllers-and-model-service-boundaries
    - acl-for-state-changing-actions
    - webassetmanager-usage
    - install-update-uninstall-safety
    - deprecated-api-review
  conditional_checks:
    plugin:
      - explicit-event-contracts
      - typed-or-modern-event-patterns
    admin-ui:
      - joomla-dialog-over-bootstrap-modal
      - form-validator-webasset
    api:
      - webservices-routing-and-registration
      - api-auth-and-response-shape

notes:
  - Bootstrap completed for artifact-driven development flow inside .webtolk.
  - Keep Joomla-specific decisions in project context and overlays, not in core templates.
  - Base delivery target is a Joomla extension package with a library, configuration plugin and extensible adapters for consumer extensions.
  - Local Joomla knowledge sources: D:/.agents/docs/, D:/.agents/docs/joomla-toolkit/, Context7.
  - Fork source library: D:/Dev/WT-Otpravkapochtaru-joomla-library/docs/lapay-group-russian-post-library/
  - Required namespace root: Webtolk\\Otpravkapochtaru
  - Architecture references: D:/dev/WT-Amo-CRM-library-for-Joomla-4/ and D:/dev/WT-CDEK-Joomla-PHP-library/
  - Investigation context must include D:/.agents/docs/joomla-development-articles/podklyuchenie-storonnih-php-bibliotek-v-joomla-web-tolk.md.
  - Core-first policy applies: prefer Joomla core and shared libraries before introducing custom abstractions or helper layers.
  - Do not invent new methods or abstractions when Joomla core already provides equivalent capabilities.
  - Deprecated Joomla 3 API is forbidden; architectural baseline is Joomla 5+.
  - Serena usage must be recorded in stage logs when symbol-aware analysis, semantic navigation or reference lookup is required by the task.
  - Context7 usage is enabled as an additional documentation source; selected Joomla library ID: /joomla/manual.
  - Backward compatibility with the old Webtolk Russian Post library is not required; that package is a historical reference only.
  - The new library is intended for internal use in our own plugin, so its public API may be redesigned around the target Joomla architecture.
  - Delivery shape for implementation is a Joomla package containing a library extension and a companion system plugin.
  - Architecture re-baseline after implementation review: prefer a facade-first Joomla structure with `Otpravkapochtaru`, a thin REST `Request` helper, a separate SOAP `Tracking` helper, selected donor `Entity/*`, and only thin cache/log traits when justified.
  - User clarification on 2026-04-22: the array contract applies only to public facade outputs; internal architecture must still include the approved selected donor `Entity/*` layer.
  - Current implementation drift without `TrackingEntity` and `Entity/*` is not an approved simplification; it must be corrected in the next implementation slice.
  - `Service/*` and `Value/*` are not approved target layers for this Joomla 5+ library and should be treated as provisional implementation scaffolding if present.
  - WT CDEK is now confirmed locally at `D:/Dev/WT-CDEK-Joomla-PHP-library/` and should be used as the primary reference for thin `CacheTrait` and `LogTrait` reuse with namespace fixes only.
  - Tracking architecture decision: external Joomla consumers should receive only plain arrays or arrays with normalized errors, following WT CDEK more closely than WT AmoCRM. Russian Post tracking should use a separate `SoapRequest`, while `TrackingEntity` switches `single` and `pack` modes internally.
  - Local Joomla verification target was re-confirmed on 2026-04-22 as `D:/OSPanel/home/joomla.local/public` with admin URL `http://joomla.local/administrator`; older `WT-Otpravkapochtaru-joomla-library` paths are stale.
