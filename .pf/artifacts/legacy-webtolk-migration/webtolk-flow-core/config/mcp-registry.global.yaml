registry:
  scope: global
  version: 1.0.0
servers:
  - name: phpstorm-mcp
    role: code-workspace-authority
    required_for:
      - code-reading
      - file-navigation
      - project-file-edits
    fallback_policy:
      allowed: true
      fallback_to:
        - serena
        - shell
      record_telemetry: true
      condition: use fallback only when server is unavailable or operation is unsupported
  - name: serena
    role: symbol-analysis-authority
    required_for:
      - symbol-analysis
      - reference-tracing
      - structure-mapping
    fallback_policy:
      allowed: true
      fallback_to:
        - phpstorm-mcp
        - shell
      record_telemetry: true
      condition: fallback only when symbolic access is unavailable
  - name: devtools
    role: browser-runtime-authority
    required_for:
      - browser-navigation
      - ui-verification
      - network-observation
    fallback_policy:
      allowed: true
      fallback_to:
        - shell
      record_telemetry: true
      condition: fallback only when browser runtime is not required or devtools are unavailable
  - name: shell
    role: controlled-fallback
    required_for:
      - simple-environment-inspection
      - command-execution
    fallback_policy:
      allowed: true
      fallback_to: []
      record_telemetry: true
      condition: use only after MCP policy check and always log the reason
