registry:
  scope: project
  version: 1.0.0
servers:
  - name: phpstorm-mcp
    enabled: true
    preferred_for:
      - code-reading
      - file-edits
      - workspace-search
    notes: Project-level source of truth for file operations when available.
  - name: serena
    enabled: true
    preferred_for:
      - symbol-analysis
      - reference-lookup
      - semantic-structure
    notes: Required before plain text search for shared or multi-file structures.
  - name: devtools
    enabled: true
    preferred_for:
      - browser-verification
      - runtime-observation
    notes: Required for browser verification reports.
  - name: shell
    enabled: true
    preferred_for:
      - fallback
    notes: Allowed only with explicit fallback reason and telemetry event.
