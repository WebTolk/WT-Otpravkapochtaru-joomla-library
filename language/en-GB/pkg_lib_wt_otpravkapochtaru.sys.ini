PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s What's new?</h3><ul><li>Russian Post API coverage has been expanded significantly: beyond delivery calculation, the library now works with shipments, batches, documents, dictionaries and post offices.</li><li>Shipment tracking has been added. Tracking methods require PHP SOAP, so missing SOAP no longer blocks installation and is shown as a warning.</li><li>Version 3.0 is a Joomla wrapper over the LapayGroup RussianPost SDK: the SDK handles low-level API communication, while this package adds Joomla integration, settings and Form fields.</li><li>The library can be used in your own Joomla extensions through the Webtolk\Otpravkapochtaru namespace: facade methods, Form fields, transport and credentials from the system plugin are available.</li><li>API settings now live in the system plugin, so multiple extensions can share one Russian Post connection configuration.</li></ul><p>Configure Russian Post API credentials in the system plugin before using the integration.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wtotpravkapochtaru\">Go to the integration plugin.</a></p>"
