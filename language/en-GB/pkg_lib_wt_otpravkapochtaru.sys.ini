PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s What's new?</h3><p>The library provides a ready API layer for delivery calculation, shipment creation, batch operations, document generation, postal office lookup and tracking by barcode.</p><p>Configure only the required Russian Post API credentials in the system plugin before using the integration.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wt_otpravkapochtaru\">Go to the integration plugin.</a></p>"
