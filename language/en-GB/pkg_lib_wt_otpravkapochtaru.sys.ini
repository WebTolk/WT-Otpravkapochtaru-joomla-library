PKG_LIB_WT_OTPRAVKAPOCHTARU_XML_DESCRIPTION="<p>WT Otpravkapochtaru connects Joomla extensions to Russian Post services: calculates delivery cost and terms, creates and manages shipments, prepares batches and documents, works with postal offices and dictionaries, and receives shipment tracking data.</p>"
