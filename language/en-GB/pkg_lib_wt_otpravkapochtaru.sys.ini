PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s What's new?</h3><p>The package installs the WT Otpravkapochtaru library and enables the system plugin for storing Russian Post API credentials.</p><p>Open the plugin settings, enter REST API credentials, and use the account status field to check the connection.</p><p>SOAP tracking uses separate tracking credentials in the same plugin settings.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wt_otpravkapochtaru\">Go to the integration plugin.</a></p>"
