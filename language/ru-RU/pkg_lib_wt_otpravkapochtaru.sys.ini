PKG_LIB_WT_OTPRAVKAPOCHTARU_XML_DESCRIPTION="<p>WT Otpravkapochtaru подключает расширения Joomla к сервисам Почты России: рассчитывает стоимость и сроки доставки, создает и управляет отправлениями, формирует партии и документы, работает с отделениями и справочниками, получает данные трекинга отправлений.</p>"
