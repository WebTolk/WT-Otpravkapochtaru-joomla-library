PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s Что нового?</h3><p>Библиотека дает готовый API-слой для расчета доставки, создания отправлений, операций с партиями, формирования документов, поиска отделений и трекинга по почтовому идентификатору.</p><p>Перед использованием достаточно указать нужные учетные данные API Почты России в системном плагине.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wt_otpravkapochtaru\">Перейти к плагину интеграции.</a></p>"
