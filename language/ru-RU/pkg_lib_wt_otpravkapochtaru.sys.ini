PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s Что нового?</h3><ul><li>Значительно расширено покрытие API Почты России: кроме расчета доставки библиотека работает с отправлениями, партиями, документами, справочниками и отделениями.</li><li>Добавлен трекинг отправлений. Для методов трекинга нужен PHP SOAP, поэтому отсутствие SOAP больше не блокирует установку и показывается как предупреждение.</li><li>Версия 3.0 стала Joomla-оберткой над LapayGroup RussianPost SDK: SDK отвечает за низкоуровневую работу с API, а пакет добавляет Joomla-интеграцию, настройки и поля Form.</li><li>Библиотеку можно использовать в собственных расширениях Joomla через namespace Webtolk\Otpravkapochtaru: доступен фасад Otpravkapochtaru, поля Form, транспорт и получение учетных данных из системного плагина.</li><li>Настройки API вынесены в системный плагин, чтобы несколько расширений могли использовать одну конфигурацию подключения к Почте России.</li></ul><p>Перед использованием укажите учетные данные API Почты России в системном плагине.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wtotpravkapochtaru\">Перейти к плагину интеграции.</a></p>"
