PKG_LIB_WT_OTPRAVKAPOCHTARU_WHATS_NEW="<h3>v.%s Что нового?</h3><p>Пакет устанавливает библиотеку WT Otpravkapochtaru и включает системный плагин для хранения учетных данных API Почты России.</p><p>Откройте настройки плагина, укажите учетные данные REST API и проверьте подключение через поле статуса аккаунта.</p><p>SOAP-трекинг использует отдельные учетные данные трекинга в тех же настройках плагина.</p><p><a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=wt_otpravkapochtaru\">Перейти к плагину интеграции.</a></p>"
